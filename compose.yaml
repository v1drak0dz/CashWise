services:

  backend:
    build:
      context: .
      dockerfile: src/CashWise.Api/Dockerfile
    expose:
      - "8080"
    volumes:
      - cashwise-data:/app/data

  frontend:
    build:
      context: ./src/CashWise.UI
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    
volumes:
  cashwise-data: